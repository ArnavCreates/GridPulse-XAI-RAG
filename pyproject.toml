[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gridpulse-xai-rag"
version = "1.0.0"
description = "Tri-Modal Distributed Grid Anomaly Detection with Per-Alert SHAP Attributions and ChromaDB Runbook RAG"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Arnav Jain", email = "arnav.learns0908@gmail.com" }]
license = { file = "LICENSE" }
dependencies = [
    "torch>=2.0.0",
    "lightgbm>=4.0.0",
    "shap>=0.44.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "networkx>=3.2",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "prometheus-client>=0.17.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "httpx>=0.24.0",
    "pytest>=7.4.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning"
]
